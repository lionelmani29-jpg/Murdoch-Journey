}dialog::backdrop{background:#161b2277;backdrop-filter:blur(5px)}svg[viewBox]{max-height:250px;width:100%;margin-top:14px}nav{padding:8px 8px max(8px,env(safe-area-inset-bottom));gap:4px}nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:10px;font-size:10px;min-width:0}nav button svg{width:19px;height:19px}nav button[aria-current=page]{box-shadow:none;background:#faedf0;color:var(--red)}.nav-brand,.nav-foot{display:none}#toast{font-size:13px;box-shadow:0 10px 40px #0002}

</style></head><body>
<div class="app"><nav id="nav" aria-label="Main"></nav>
<div class="col"><header class="top"><div class="wordmark"><span class="brand-mark" aria-hidden="true">MJ</span><div><span class="eyebrow">CAMPUS COMPANION</span><b>Murdoch Journey</b></div></div><span class="concept-pill">STUDENT CONCEPT</span></header><div class="prototype-note">An independent student prototype. Parking, payments, rewards and travel information are simulated.</div>
<main id="main" tabindex="-1"></main>
<details class="demo"><summary>Demo controls (not part of the student app)</summary>
<p class="mut">Demo clock (Perth time): <b id="clk"></b></p>
<label for="ck">Set demo date and time</label><input id="ck" type="datetime-local"> <button class="btn s" data-act="setClock">Apply</button>
<div><button class="btn s" data-act="jElig">Jump to eligible booking date</button><button class="btn s" data-act="jStart">Jump to reservation start</button><button class="btn s" data-act="jGrace">Advance past check-in grace</button><button class="btn s" data-act="busy">Toggle busy carpark</button><button class="btn s" data-act="overstay">Simulate overstay</button><button class="btn s" data-act="reset">Reset all data</button></div></details>
</div></div>
<dialog id="dlg" aria-live="polite"></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
const KEY='murdoch-journey-refined-v2',H=36e5,M=6e4,PERTH=8*H,$=s=>document.querySelector(s);
const ZONES={A:{n:'Green Zone A',cap:30,walk:8,bg:12,bgB:29,occ:.55},B:{n:'Green Zone B',cap:30,walk:11,bg:9,bgB:30,occ:.4},C:{n:'Green Zone C',cap:20,walk:14,bg:6,bgB:19,occ:.3}};
const tf=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Perth',hour:'numeric',minute:'2-digit',hour12:true}),df=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Perth',weekday:'short',day:'numeric',month:'short'});
const T=x=>tf.format(x).toLowerCase(),D=x=>df.format(x),DT=x=>D(x)+', '+T(x),li=x=>new Date(x+PERTH).toISOString().slice(0,16),pl=v=>Date.parse(v+':00+08:00');
let S;
function seed(){const d0=Math.floor((Date.now()+PERTH)/864e5)*864e5-PERTH,n=d0+8.5*H;
const mk=(id,name,room,day,sh,eh)=>({id,name,room,start:d0+day*864e5+sh*H,end:d0+day*864e5+eh*H,drive:35});
const c=[mk('c1','Data Structures lecture','Sample room, Building 460',0,10,11.5),mk('c3','Statistics tutorial','Sample room, Building 245',2,10,11.5),mk('c2','Project studio','Sample room, Building 500',5,10,11.5)];
return{v:1,now:n,busy:0,permit:'green',classes:c,sel:'c1',tab:'home',seq:1002,chat:[],standby:{},vouchers:[],
bookings:[{ref:'MJ-1001',cid:'c1',zone:'A',bay:13,start:c[0].start-20*M,end:c[0].end+30*M,bookedAt:n-96*H,amt:4,status:'confirmed'}],
tx:[{id:'s1',pts:40,label:'Earlier demo bookings',at:n-9*864e5},{id:'s2',pts:30,label:'Earlier demo bookings',at:n-6*864e5},{id:'s3',pts:15,label:'Earlier demo bookings',at:n-3*864e5}]}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||S.v!==1)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cl=id=>S.classes.find(c=>c.id===id),act=b=>b.status==='confirmed'||b.status==='checkedin',win=c=>[c.start-20*M,c.end+30*M],ovl=(a,b,c,d)=>a<d&&c<b;
const bay=b=>b.zone+String(b.bay).padStart(2,'0'),dep=b=>b.start-cl(b.cid).drive*M-5*M,pts=()=>S.tx.reduce((a,t)=>a+t.pts,0);
const hrs=ms=>{ms=Math.max(0,ms);return Math.floor(ms/H)+' h '+Math.round(ms%H/M)+' min'};
const sorted=()=>[...S.classes].sort((a,b)=>a.start-b.start),nextC=()=>sorted().find(c=>c.end>S.now)||sorted()[sorted().length-1];
const bk=cid=>{const l=S.bookings.filter(b=>b.cid===cid);return l.find(act)||l[l.length-1]};
const holdEnd=b=>b.status==='confirmed'?b.end:b.status==='checkedin'?(S.now>b.end?Infinity:b.end):b.status==='completed'?b.outAt:null;
const held=(z,s,e)=>S.bookings.filter(b=>b.zone===z&&holdEnd(b)!=null&&ovl(b.start,holdEnd(b),s,e));
const bg=z=>S.busy?ZONES[z].bgB:ZONES[z].bg;
function blocked(z,s,e){return new Set([...Array.from({length:bg(z)},(_,i)=>i+1),...held(z,s,e).map(b=>b.bay)])}
const avail=(z,s,e)=>Math.max(0,ZONES[z].cap-blocked(z,s,e).size);
const phys=z=>Math.min(ZONES[z].cap,Math.round(ZONES[z].cap*(S.busy?.97:ZONES[z].occ))+S.bookings.filter(b=>b.zone===z&&b.status==='checkedin').length);
function assign(z,s,e){const u=blocked(z,s,e);for(let k=bg(z)+1;k<=ZONES[z].cap;k++)if(!u.has(k))return k;return 0}
function award(id,p,label){if(S.tx.some(t=>t.id===id))return false;S.tx.push({id,pts:p,label,at:S.now});return true}
function tick(){S.bookings.forEach(b=>{if(b.status==='confirmed'&&S.now>b.start+10*M){b.status='noshow';b.relAt=S.now}})}
function rules(c,z){const[s,e]=win(c),er=[];
if(s-S.now<72*H)er.push(`This reservation would start in ${hrs(s-S.now)}. The prototype requires at least 72 hours' notice before the parking interval starts (our explicit interpretation of "three days in advance"), so same-day and short-notice app bookings are rejected.`);
if(S.bookings.some(b=>b.cid===c.id&&act(b)))er.push('You already have an active booking for this class.');
else if(S.bookings.some(b=>act(b)&&ovl(b.start,holdEnd(b),s,e)))er.push('This overlaps another active booking of yours.');
if(S.permit!=='green')er.push('Your permit does not match this green-zone area.');
else if(!assign(z,s,e))er.push('No app-reservable bays remain in this zone for the full interval.');
return er}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4500)};
const dlg=h=>{$('#dlg').innerHTML=h;if(!$('#dlg').open)$('#dlg').showModal()};
const ST={confirmed:['Confirmed','ok'],checkedin:['Checked in','ok'],completed:['Completed','ok'],cancelled:['Cancelled — payment retained','warn'],noshow:['No-show released — payment retained','warn']};
const badge=b=>b.status==='checkedin'&&S.now>b.end?'<span class="b full">Overstay — bay still occupied</span>':`<span class="b ${ST[b.status][1]}">${ST[b.status][0]}</span>`;
const lv=(a,c)=>a<=0?['Full','full']:a/c<.3?['Limited','warn']:['Plenty','ok'];
function journey(c){const b=bk(c.id),z=b&&b.status!=='cancelled'&&b.status!=='noshow'?b.zone:'A',rs=win(c)[0],w=ZONES[z].walk;return{z,rs,w,depart:rs-c.drive*M-5*M,arr:rs+w*M}}
const V={
home(){const c=nextC(),b=bk(c.id),j=journey(c),day=Math.floor((c.start+PERTH)/864e5);
let h=`<h2>A little more certainty.</h2><p class="page-intro">Hi Manikandan. Your classes, your journey, your parking — all in one place.</p><div class="card hero"><p class="lead-label">YOUR NEXT CAMPUS DAY</p><h3>${c.name}</h3><p>${DT(c.start)}–${T(c.end)} · ${c.room}</p>
<div class="grid"><div class="kv"><span class="mut">Leave home by</span><b>${T(j.depart)}</b></div><div class="kv"><span class="mut">Drive (simulated)</span><b>${c.drive} min</b></div><div class="kv"><span class="mut">Arrival buffer</span><b>5 min</b></div><div class="kv"><span class="mut">Walk from ${j.z}</span><b>${j.w} min</b></div><div class="kv"><span class="mut">Arrive at class</span><b>${T(j.arr)}</b></div><div class="kv"><span class="mut">Points</span><b>${pts()}</b></div></div>
<p>Booking: ${b?badge(b):'<span class="b warn">No parking booked</span>'} <span class="mut">Estimates are simulated, not live traffic.${b?'':' Based on nearest zone (A).'}</span></p>
<button class="btn big" data-act="plan" data-c="${c.id}">Plan and book parking</button></div><div class="card"><h3>Timeline · ${D(c.start)}</h3>`;
sorted().filter(x=>Math.floor((x.start+PERTH)/864e5)===day).forEach(x=>{const k=journey(x);h+=`<p><b>${x.name}</b></p><ol class="tl"><li>${T(k.depart)} — leave home</li><li>${T(k.depart+x.drive*M)} — arrive near campus; ${T(k.rs)} reservation starts (5 min arrival buffer)</li><li>${T(k.rs)}–${T(k.arr)} — walk from Zone ${k.z} (${k.w} min)</li><li>${T(x.start)}–${T(x.end)} — class</li><li>${T(x.end+30*M)} — reservation ends</li></ol>`});
h+=`</div><div class="card"><h3>Your timetable</h3><p class="mut">Edit times and simulated journey; the plan recalculates. Classes with an active booking are locked.</p>`;
sorted().forEach(x=>{const lock=S.bookings.some(k=>k.cid===x.id&&act(k)),er=rules(x,'A').find(e=>e.startsWith('This reservation'));
h+=`<div class="card"><b>${x.name}</b> <span class="b ${er?'warn':'ok'}">${lock?'Parking confirmed':er?'Advance booking closed':'Eligible to book'}</span><div class="grid"><div><label for="s${x.id}">Start</label><input id="s${x.id}" type="datetime-local" data-ed="start" data-c="${x.id}" value="${li(x.start)}" ${lock?'disabled':''}></div><div><label for="e${x.id}">End</label><input id="e${x.id}" type="datetime-local" data-ed="end" data-c="${x.id}" value="${li(x.end)}" ${lock?'disabled':''}></div><div><label for="d${x.id}">Drive (min)</label><input id="d${x.id}" type="number" min="5" max="120" data-ed="drive" data-c="${x.id}" value="${x.drive}" ${lock?'disabled':''}></div></div><button class="btn s" data-act="plan" data-c="${x.id}">Plan parking</button></div>`});
return h+'</div>'},
parking(){const c=cl(S.sel)||nextC(),[s,e]=win(c),ok=S.permit==='green';
let h=`<h2>Find your space.</h2><p class="page-intro">Choose your class. We’ll match your permit, arrival window and walk to campus.</p><div class="card"><div class="grid"><div><label for="fc">Class (sets date)</label><select id="fc" data-sel="c">${sorted().map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.name} — ${D(x.start)}</option>`).join('')}</select></div><div><label for="fp">Permit</label><select id="fp" data-sel="p"><option value="green" ${ok?'selected':''}>Green permit</option><option value="blue" ${ok?'':'selected'}>Other permit (not eligible)</option></select></div></div>
<p>Reservation interval: <b>${DT(s)}–${T(e)}</b> (20 min before to 30 min after class). <span class="b warn">Simulated availability</span> <span class="mut">observed ${DT(S.now)} Perth</span></p>
<p class="mut"><b>An empty bay may already be reserved.</b> “Available now” does not mean available for the full interval — compare the two bars on each card.</p>
<svg viewBox="0 0 360 150" role="img" aria-label="Schematic campus map, not geographically accurate. ${Object.keys(ZONES).map(z=>`${ZONES[z].n} ${ok?avail(z,s,e)+' bays free for interval':'not eligible'}`).join('; ')}"><rect x="110" y="100" width="140" height="40" rx="6" fill="none" stroke="currentColor" stroke-dasharray="4"/><text x="180" y="124" text-anchor="middle">Class building (schematic)</text>`;
Object.keys(ZONES).forEach((z,i)=>{const a=avail(z,s,e),l=ok?lv(a,ZONES[z].cap)[1]:'full',x=10+i*120;h+=`<line x1="${x+50}" y1="80" x2="180" y2="100" stroke="currentColor" stroke-dasharray="3" opacity=".5"/><rect class="z ${l}" x="${x}" y="8" width="100" height="72" rx="8"/><text x="${x+50}" y="30" text-anchor="middle" font-weight="700">Zone ${z}</text><text x="${x+50}" y="48" text-anchor="middle">${ok?a+' free (interval)':'Not eligible'}</text><text x="${x+50}" y="66" text-anchor="middle">walk ${ZONES[z].walk} min</text>`});
h+='</svg></div>';
Object.keys(ZONES).forEach(z=>{const Z=ZONES[z],a=avail(z,s,e),p=phys(z),[lt,lc]=ok?lv(a,Z.cap):['Not eligible','full'];
h+=`<div class="card"><h3>${Z.n} <span class="b ${lc}">${lt}</span></h3><p>Walk to ${c.name}: <b>${Z.walk} min</b></p><p><b>${ok?a:0}</b> of ${Z.cap} bays free for the whole interval</p>
<span class="mut">Reserved or occupied during your interval: ${Z.cap-a}</span><div class="bar r" aria-hidden="true"><i style="width:${(Z.cap-a)/Z.cap*100}%"></i></div>
<span class="mut">Physically occupied right now: ${p} (${Z.cap-p} look empty)</span><div class="bar" aria-hidden="true"><i style="width:${p/Z.cap*100}%"></i></div>
<button class="btn" data-act="book" data-c="${c.id}" data-z="${z}" ${ok&&a>0?'':'disabled'}>Reserve in ${Z.n}</button></div>`});
const eo=S.busy?18:7;
return h+`<div class="card"><h3>Emergency drive-in bays <span class="b warn">Not reservable</span></h3><p>About ${20-eo} of 20 shown free right now (simulated). These are a separate pool from the 80 app-reservable bays, cannot be booked in the app, and no space is promised.</p></div>`},
bookings(){const l=[...S.bookings].reverse();let h='<h2>You’re on the list.</h2><p class="page-intro">Your parking plans, arrival windows and check-in details.</p>';if(!l.length)h+='<div class="card">No bookings yet. Use “Plan and book parking” on Home.</div>';
l.forEach(b=>{const c=cl(b.cid),ov=b.status==='checkedin'&&S.now>b.end;
h+=`<article class="card"><h3>${b.ref} · ${c.name}</h3><p>${badge(b)}</p><p>${ZONES[b.zone].n}, bay <b>${bay(b)}</b> · ${D(b.start)}, ${T(b.start)}–${T(b.end)}<br>Class ${T(c.start)}–${T(c.end)}, ${c.room}<br>Paid AUD $${b.amt}.00 (illustrative, non-refundable) · Departure reminder ${T(dep(b))}</p>`;
if(b.status==='confirmed')h+=`<p class="mut">Check-in opens ${T(b.start)} and is on time through ${T(b.start+10*M)} (proposed grace period). After that the booking becomes a no-show and the bay is released.</p><button class="btn" data-act="ci" data-r="${b.ref}" ${S.now>=b.start?'':'disabled'}>Simulate check-in</button><button class="btn s" data-act="cancelAsk" data-r="${b.ref}">Cancel booking</button>`;
if(b.status==='checkedin')h+=(ov?`<div class="al"><b>Overstay flagged.</b> The booking passed ${T(b.end)} without checkout. The bay stays shown as occupied.</div>`:'')+`<button class="btn" data-act="co" data-r="${b.ref}">Simulate checkout</button>`;
if(b.status==='noshow')h+=`<p>Not checked in by ${T(b.start+10*M)}: bay released, payment retained, and this booking no longer holds that bay. Same-day app bookings are prohibited, so released capacity goes to a simulated on-site standby queue until the next reservation; baseline 80/20 allocation is unchanged. You cannot reclaim the bay — you can ask for standby help, with no guarantee.</p>${S.standby[b.ref]?'<span class="b ok">Standby assistance requested (simulated)</span>':`<button class="btn s" data-act="standby" data-r="${b.ref}">Request standby assistance</button>`}`;
if(b.status==='cancelled')h+='<p>Cancelled before check-in. Payment retained; bay released. A new app booking still needs 72 hours’ notice.</p>';
if(b.status==='completed')h+=`<p>Checked out ${T(b.outAt)}; remaining interval released.</p>`;
h+='</article>'});return h+'<p class="mut">Check-in and checkout are button simulations — no vehicle detection or location verification.</p>'},
rewards(){const p=pts(),h0=[...S.tx].reverse().sort((a,b)=>b.at-a.at);
let h=`<h2>Good habits. Little rewards.</h2><p class="page-intro">Arrive calmly, check out on time and make room for the next student.</p><div class="card"><div class="kv"><span class="mut">Points balance</span><b>${p}</b></div><p class="mut">Progress to demo AUD $5 café voucher (100 pts)</p><div class="bar p" role="progressbar" aria-valuenow="${Math.min(p,100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(p,100)}%"></i></div>
<button class="btn" data-act="redeem" ${p>=100?'':'disabled'}>Redeem 100 points</button><p class="mut">+10 for checking in within the arrival window · +5 for checking out by reservation end. Points reward calm, on-time parking — never rush or use your phone while driving. Illustrative; no real retailer partnership.</p></div>`;
S.vouchers.forEach(v=>h+=`<div class="card"><h3>Demo café voucher AUD $5</h3><p>Code ${v}</p><span class="b warn">Demo only — no monetary value</span></div>`);
h+='<div class="card"><h3>History</h3>'+h0.map(t=>`<p>${t.pts>0?'+':''}${t.pts} · ${t.label} <span class="mut">${DT(t.at)}</span></p>`).join('')+'</div>';return h},
assistant(){return`<h2>A hand with your day.</h2><p class="page-intro">From your front door to your classroom. Let’s work out the details.</p><p class="mut">Rule-based and simulated. No live traffic, real parking data or guaranteed standby. Never use this app while driving.</p><div>${['leave:When should I leave?','plan:Plan my next campus day.','why:Why can’t I book this date?','cancel:What happens if I cancel?','late:I’m running late.','permit:Where can I park with my green permit?'].map(x=>`<button class="btn s" data-act="ask" data-k="${x.split(':')[0]}">${x.split(':')[1]}</button>`).join('')}</div><div class="chat" aria-live="polite">${S.chat.map(m=>`<p class="q">${m.q}</p><p>${m.a}</p>`).join('')||'<p>Hi! Pick a question above.</p>'}</div>`}};
function answer(k){const c=cl(S.sel)||nextC(),b=bk(c.id),j=journey(c),[s,e]=win(c);
if(k==='leave')return`For ${c.name} (${T(c.start)}), leave by ${T(j.depart)}: ${c.drive} min simulated drive, 5 min arrival buffer to be at the car park by ${T(j.rs)}, then ${j.w} min walk from Zone ${j.z}, arriving about ${T(j.arr)}. ${b&&act(b)?'':'No active booking yet, so this assumes Zone A. '}This is not live traffic.`;
if(k==='plan')return'Plan: '+sorted().map(x=>{const er=rules(x,'A').some(m=>m.startsWith('This reservation'));return`${x.name} (${DT(x.start)}) — ${er?'inside 72 h, not bookable':'bookable'}`}).join('; ')+'. Use “Plan and book parking” on Home.';
if(k==='why'){const l=sorted().map(x=>rules(x,'A').find(m=>m.startsWith('This reservation'))?`${x.name}: starts in ${hrs(win(x)[0]-S.now)} — under 72 h.`:`${x.name}: meets the 72 h rule.`);return l.join(' ')+' Reservations need 72 hours’ notice before the interval begins (prototype interpretation of three days).'}
if(k==='cancel')return'You can cancel any time before check-in. Payment is retained (non-refundable), the bay is released immediately, and any new app booking still needs 72 hours’ notice.';
if(k==='late'){const n=S.bookings.filter(x=>x.cid===c.id).pop();if(!n)return'You have no booking for your next class, and same-day app bookings are not allowed. Drive safely; on-site drive-in bays exist but no space is promised.';
if(n.status==='confirmed')return`Please don’t use the app while driving — park safely first. Check-in is on time through ${T(n.start+10*M)}. After that the booking becomes a no-show, the bay is released and payment is retained. Status: ${S.now<n.start?'your reservation starts '+T(n.start):'grace period running'}.`;
if(n.status==='noshow')return'Your grace period has expired: the booking was marked no-show, the bay released and payment retained. You can’t reclaim it, but you can request on-site standby assistance (not guaranteed) once parked safely.';
return'Your booking status is: '+ST[n.status][0]+'.'}
if(k==='permit'){return'Green permit areas (demo data) for '+c.name+': '+Object.keys(ZONES).map(z=>`${ZONES[z].n} — ${avail(z,s,e)} free for your interval, ${ZONES[z].walk} min walk`).join('; ')+'. Simulated availability.'}}

const icons={home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',parking:'<rect x="4" y="3" width="16" height="18" rx="4"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/>',bookings:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 5 3 2 5-4"/>',rewards:'<path d="M12 3 15 9l6 1-5 5 1 6-5-3-5 3 1-6-5-5 6-1Z"/>',assistant:'<path d="M20 11a8 8 0 0 1-8 8H4l-2 3V11a9 9 0 0 1 18 0Z"/><path d="M7 11h.1m5 0h.1m5 0h.1"/>'};
function polish(){
const nav=$('#nav');nav.insertAdjacentHTML('afterbegin','<div class="nav-brand">YOUR CAMPUS, CONNECTED</div>');
nav.querySelectorAll('button').forEach(b=>b.insertAdjacentHTML('afterbegin',`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[b.dataset.t]}</svg>`));
nav.insertAdjacentHTML('beforeend','<div class="nav-foot"><strong>Manikandan</strong>Student · Green permit<br><br>Perth campus · Demo mode</div>');
if(S.tab==='parking'){const cards=[...$('#main').children].filter(e=>e.classList.contains('card')&&e.querySelector('[data-act="book"]'));if(cards.length){const grid=document.createElement('div');grid.className='parking-cards';cards[0].before(grid);cards.forEach(c=>grid.append(c));}}
if(S.tab==='home'){const cards=[...$('#main').children].filter(e=>e.classList.contains('card'));if(cards[1])cards[1].querySelector('h3').textContent='Your day, step by step · '+D(nextC().start);const button=$('#main [data-act="plan"]');const b=bk(nextC().id);if(button&&b&&act(b)){button.textContent='View my parking pass';button.dataset.act='tab';button.dataset.t='bookings';}}
}

function render(){tick();save();$('#nav').innerHTML=[['home','Home'],['parking','Parking'],['bookings','Bookings'],['rewards','Rewards'],['assistant','Assistant']].map(([t,l])=>`<button data-act="tab" data-t="${t}" ${S.tab===t?'aria-current="page"':''}>${l}</button>`).join('');
$('#main').innerHTML=V[S.tab]();$('#clk').textContent=DT(S.now)+(S.busy?' · busy carpark ON':'');$('#ck').value=li(S.now);polish()}
const find=r=>S.bookings.find(b=>b.ref===r);
function doCI(b){b.status='checkedin';b.inAt=S.now;return award('ci-'+b.ref,10,'On-time check-in '+b.ref)}
const ACT={
tab:d=>{S.tab=d.t;render();$('#main').focus()},
plan:d=>{S.sel=d.c;S.tab='parking';render();$('#main').focus()},
book:d=>{const c=cl(d.c),z=d.z,er=rules(c,z),[s,e]=win(c);
dlg(`<h2>Confirm reservation</h2><p><b>${c.name}</b>, ${DT(c.start)}–${T(c.end)}</p><p>${ZONES[z].n} · ${DT(s)}–${T(e)}<br>Illustrative booking charge: <b>AUD $4.00</b>, collected now.</p>`+(er.length?`<div class="al" role="alert"><b>Can’t book:</b><br>${er.join('<br>')}</div>`:`<p><b>Non-refundable:</b> cancellations and no-shows keep the payment.</p><button class="btn" data-act="pay" data-ok="1" data-c="${c.id}" data-z="${z}">Simulate successful payment</button><button class="btn s" data-act="pay" data-ok="0" data-c="${c.id}" data-z="${z}">Simulate failed payment</button>`)+`<details><summary>Policy details (prototype proposals)</summary><ul><li>72 hours’ notice before interval start.</li><li>Interval: 20 min before class to 30 min after.</li><li>Check-in grace 10 min, then no-show and release.</li><li>The $4 charge is illustrative; its relationship to existing permit fees is undecided.</li></ul></details><button class="btn s" data-act="close">Close</button>`)},
pay:d=>{const c=cl(d.c),z=d.z;if(d.ok!=='1'){return dlg(`<h2>Payment failed (simulated)</h2><p>No booking was created and no bay was held. Availability is unchanged.</p><button class="btn" data-act="book" data-c="${c.id}" data-z="${z}">Try again</button><button class="btn s" data-act="close">Close</button>`)}
tick();const er=rules(c,z);if(er.length)return dlg(`<h2>Can’t book</h2><div class="al">${er.join('<br>')}</div><button class="btn s" data-act="close">Close</button>`);
const[s,e]=win(c),b={ref:'MJ-'+S.seq++,cid:c.id,zone:z,bay:assign(z,s,e),start:s,end:e,bookedAt:S.now,amt:4,status:'confirmed'};S.bookings.push(b);render();
dlg(`<h2>✅ Booking confirmed</h2><p>Reference <b>${b.ref}</b><br>${ZONES[z].n}, bay <b>${bay(b)}</b><br>${D(s)}, ${T(s)}–${T(e)}<br>Paid AUD $4.00 (illustrative, non-refundable)<br>${c.name}, ${T(c.start)}–${T(c.end)}, ${c.room}<br>Departure reminder: ${T(dep(b))}</p><button class="btn" data-act="ci" data-r="${b.ref}" ${S.now>=s?'':'disabled'}>Simulate check-in</button><button class="btn s" data-act="cancelAsk" data-r="${b.ref}">Cancel booking</button><button class="btn s" data-act="goB">View bookings</button>`)},
goB:()=>{$('#dlg').close();S.tab='bookings';render()},close:()=>$('#dlg').close(),
cancelAsk:d=>dlg(`<h2>Cancel ${d.r}?</h2><p>Your payment is <b>retained</b> (non-refundable). The bay is released immediately. A new app booking still requires 72 hours’ notice.</p><button class="btn" data-act="cancelYes" data-r="${d.r}">Yes, cancel</button><button class="btn s" data-act="close">Keep booking</button>`),
cancelYes:d=>{const b=find(d.r);$('#dlg').close();tick();if(b&&b.status==='confirmed'){b.status='cancelled';toast('Cancelled. Payment retained; bay released.')}else toast('This booking can no longer be cancelled.');render()},
ci:d=>{if($('#dlg').open)$('#dlg').close();tick();const b=find(d.r);if(!b||b.status!=='confirmed'){toast('Check-in window has closed or booking changed.');return render()}
if(S.now<b.start){toast('Check-in opens at '+T(b.start));return}toast(doCI(b)?'Checked in (simulated). +10 points.':'Checked in.');render()},
co:d=>{const b=find(d.r);if(!b||b.status!=='checkedin')return render();b.status='completed';b.outAt=S.now;const on=S.now<=b.end&&award('co-'+b.ref,5,'Checkout by reservation end '+b.ref);toast(on?'Checked out. +5 points. Remaining interval released.':'Checked out after the reservation end — no checkout points.');render()},
standby:d=>{S.standby[d.r]=1;toast('Standby assistance requested (simulated). No space is guaranteed.');render()},
redeem:()=>{if(pts()<100)return toast('Not enough points.');S.tx.push({id:'rd-'+S.seq,pts:-100,label:'Redeemed demo café voucher',at:S.now});S.vouchers.push('DEMO-'+S.seq++);toast('Demo voucher added. 100 points deducted.');render()},
ask:d=>{S.chat.push({q:$('[data-k="'+d.k+'"]').textContent,a:answer(d.k)});render()},
setClock:()=>{const v=pl($('#ck').value);if(isNaN(v))return toast('Enter a valid date and time.');if(v<S.now)return toast('The demo clock only moves forward. Reset the demo to start again.');S.now=v;render()},
jElig:()=>{const c=sorted().pop();if(win(c)[0]-73*H<S.now)return toast('Reset the demo to return to this booking date.');S.now=win(c)[0]-73*H;render();toast('Clock set 73 h before '+c.name+' reservation.')},
jStart:()=>{const b=S.bookings.find(act);S.now=Math.max(S.now,b?b.start:win(nextC())[0]);render()},
jGrace:()=>{const b=S.bookings.find(x=>x.status==='confirmed');if(!b)return toast('No confirmed booking to advance.');S.now=Math.max(S.now,b.start+11*M);render()},
busy:()=>{S.busy=S.busy?0:1;render()},
overstay:()=>{const b=S.bookings.find(act);if(!b)return toast('Need an active booking first.');if(b.status==='confirmed'){S.now=b.start+5*M;doCI(b)}S.now=Math.max(S.now,b.end+15*M);S.tab='bookings';render()},
reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();$('#dlg').open&&$('#dlg').close();render();toast('All data reset.')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled&&ACT[t.dataset.act])ACT[t.dataset.act](t.dataset)});
document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.sel==='c'){S.sel=t.value;return render()}if(t.dataset.sel==='p'){S.permit=t.value;return render()}
if(!t.dataset.ed)return;const c=cl(t.dataset.c);if(S.bookings.some(b=>b.cid===c.id&&act(b))){toast('Cancel the active booking before editing this class.');return render()}
const n={start:c.start,end:c.end,drive:c.drive};n[t.dataset.ed]=t.dataset.ed==='drive'?+t.value:pl(t.value);
if(!Number.isFinite(n.start)||!Number.isFinite(n.end)||!Number.isFinite(n.drive)||!(n.drive>=5&&n.drive<=120)||!(n.end>n.start)){toast('Check values: end after start; journey 5–120 minutes.');return render()}
Object.assign(c,n);toast('Timetable updated; plan recalculated.');render()});
render();
</script></body></html>
